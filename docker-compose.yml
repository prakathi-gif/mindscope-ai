version: '3.8'

services:
  fastapi-inference-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindscope-fastapi
    environment:
      - DEPLOY_MODE=api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  streamlit-research-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindscope-streamlit
    environment:
      - DEPLOY_MODE=ui
    ports:
      - "8501:8501"
    depends_on:
      - fastapi-inference-service
    restart: unless-stopped

